<header mat-dialog-title class="dialogHeader">
    <span class="dialogIcon"><svg lucideTrophy></svg></span>
    <span><strong>Editar torneo</strong><small>Actualiza la información de esta competición.</small></span>
</header>
<form [formGroup]="form" (ngSubmit)="submit()">
    <mat-dialog-content class="dialogContent">
        @if (error()) { <p class="dialogError fieldFull">No se pudo actualizar el torneo.</p> }
        <mat-form-field appearance="outline" class="fieldFull"><mat-label>Nombre</mat-label><input matInput formControlName="name" /><mat-error>El nombre es obligatorio.</mat-error></mat-form-field>
        <mat-form-field appearance="outline"><mat-label>Organizador</mat-label><input matInput formControlName="organizer" /></mat-form-field>
        <mat-form-field appearance="outline"><mat-label>Sede</mat-label><input matInput formControlName="place" /></mat-form-field>
        <mat-form-field appearance="outline"><mat-label>Fecha de inicio</mat-label><input matInput type="date" formControlName="startDate" /></mat-form-field>
        <mat-form-field appearance="outline"><mat-label>Fecha de cierre</mat-label><input matInput type="date" formControlName="endDate" /></mat-form-field>
        <mat-form-field appearance="outline"><mat-label>Estado</mat-label><mat-select formControlName="status"><mat-option value="open">Inscripciones abiertas</mat-option><mat-option value="upcoming">Próximo</mat-option><mat-option value="finished">Finalizado</mat-option></mat-select></mat-form-field>
        <mat-form-field appearance="outline"><mat-label>Cupo máximo</mat-label><input matInput type="number" formControlName="slots" /></mat-form-field>
        <mat-form-field appearance="outline" class="fieldFull"><mat-label>Descripción</mat-label><textarea matInput rows="4" formControlName="description"></textarea></mat-form-field>
    </mat-dialog-content>
    <mat-dialog-actions align="end"><button mat-button type="button" mat-dialog-close>Cancelar</button><button mat-flat-button class="dialogSubmit" type="submit">Guardar cambios</button></mat-dialog-actions>
</form>
